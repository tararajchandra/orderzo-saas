<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrderZo POS - Cash Counter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { margin: 0 0 8px 0; font-size: 1.5rem; }
    p { margin: 0; color: #94a3b8; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="loader"></div>
  <h2>OrderZo POS</h2>
  <p id="status-text">Connecting to POS server...</p>

  <script>
    (function() {
      // 1. Detect if running inside Tauri desktop app
      var isTauri = typeof window !== 'undefined' && (
        window.__TAURI_INTERNALS__ !== undefined || 
        window.__TAURI__ !== undefined || 
        window.__TAURI_METADATA__ !== undefined
      );

      // 2. If running in a regular web browser, NEVER redirect to app.orderzo.in!
      if (!isTauri) {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var j = 0; j < names.length; j++) {
                caches.delete(names[j]);
              }
            });
          }
        } catch (swErr) {}

        // Stay strictly on current domain origin
        var origin = (window.location && window.location.origin) ? window.location.origin : '';
        if (origin && origin.indexOf('http') === 0) {
          window.location.replace(origin + '/');
        } else {
          window.location.replace('/');
        }
        return;
      }

      // 3. Only if running inside Tauri desktop app:
      try {
        var saved = localStorage.getItem('tauri_server_url') || 'https://app.orderzo.in';
        saved = saved.replace(/\/+$/, '');
        var target = saved.indexOf('/admin/orders') !== -1 ? saved : (saved + '/admin/orders');
        
        var statusEl = document.getElementById('status-text');
        if (statusEl) {
          statusEl.textContent = 'Connecting to ' + saved + '...';
        }

        window.location.href = target;
      } catch (e) {
        window.location.href = 'https://app.orderzo.in/admin/orders';
      }
    })();
  </script>
</body>
</html>
