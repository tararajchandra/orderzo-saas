<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - OrderZo POS</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      max-width: 420px;
      width: 100%;
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.5rem 0;
      color: #0f172a;
    }
    p {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0 0 1.5rem 0;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.75rem 1rem;
      background: #FF5722;
      color: white;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #e64a19;
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
      margin-top: 0.75rem;
    }
    .btn-secondary:hover {
      background: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You are Offline</h1>
    <p>No internet connection detected. You can still create orders and print bills on POS/Quick Bill, which will automatically sync once you're back online.</p>
    <button class="btn" onclick="window.history.back()">⬅️ Go Back to Previous Screen</button>
    <button class="btn btn-secondary" onclick="window.location.reload()">🔄 Try Reconnecting</button>
  </div>
</body>
</html>
